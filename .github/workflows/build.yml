name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Clone raylib
        shell: cmd
        run: |
          mkdir third_party
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git third_party\raylib

      - name: Build, Test, App
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          set ROOT=%CD%
          set BUILD=%ROOT%\build
          set RL=%ROOT%\third_party\raylib\src
          set SRCDIR=%ROOT%\src
          set MINIZDIR=%ROOT%\third_party\miniz
          set CFLAGS=/nologo /O2 /W3 /wd4996 /wd4100 /wd4189 /utf-8 /DPLATFORM_DESKTOP /DGRAPHICS_API_OPENGL_33 /D_CRT_SECURE_NO_WARNINGS
          set LIBS=user32.lib gdi32.lib shell32.lib winmm.lib opengl32.lib ole32.lib comdlg32.lib uuid.lib advapi32.lib winhttp.lib

          :: Create miniz_export.h (required by newer miniz, not generated without CMake)
          echo #pragma once > %MINIZDIR%\miniz_export.h
          echo #define MINIZ_EXPORT >> %MINIZDIR%\miniz_export.h

          mkdir build 2>nul
          cd %BUILD%

          echo [build] compiling raylib...
          cl %CFLAGS% /I"%RL%" /I"%RL%\external\glfw\include" /c "%RL%\rcore.c" "%RL%\rshapes.c" "%RL%\rtextures.c" "%RL%\rtext.c" "%RL%\rmodels.c" "%RL%\raudio.c" "%RL%\utils.c" "%RL%\rglfw.c" || exit /b 1
          lib /nologo /out:raylib.lib rcore.obj rshapes.obj rtextures.obj rtext.obj rmodels.obj raudio.obj utils.obj rglfw.obj || exit /b 1

          echo [build] compiling core...
          for /r "%SRCDIR%" %%f in (*.c) do (
            if /i not "%%~nf"=="main" if /i not "%%~nf"=="test_import" (
              cl %CFLAGS% /I"%RL%" /I"%RL%\external\glfw\include" /I"%MINIZDIR%" /I"%ROOT%" /I"%SRCDIR%" /c "%%f" /Fo"%%~nf.obj" || exit /b 1
            )
          )
          cl %CFLAGS% /I"%MINIZDIR%" /c "%MINIZDIR%\miniz.c" /Fominiz.obj || exit /b 1
          cl %CFLAGS% /I"%MINIZDIR%" /c "%MINIZDIR%\miniz_tdef.c" /Fominiz_tdef.obj || exit /b 1
          cl %CFLAGS% /I"%MINIZDIR%" /c "%MINIZDIR%\miniz_tinfl.c" /Fominiz_tinfl.obj || exit /b 1
          cl %CFLAGS% /I"%MINIZDIR%" /c "%MINIZDIR%\miniz_zip.c" /Fominiz_zip.obj || exit /b 1

          echo [build] compiling test...
          cl %CFLAGS% /I"%RL%" /I"%RL%\external\glfw\include" /I"%MINIZDIR%" /I"%ROOT%" /I"%SRCDIR%" /c "%ROOT%\tests\test_import.c" /Fott.obj || exit /b 1
          del main.obj 2>nul
          del test_import.obj 2>nul
          link /nologo /OUT:test_import.exe tt.obj *.obj raylib.lib %LIBS% || exit /b 1

          echo [build] running tests...
          :: run from project root so examples/ is found
          cd /d %ROOT%
          build\test_import.exe || exit /b 1

          echo [build] compiling app...
          cd /d %BUILD%
          del tt.obj 2>nul
          cl %CFLAGS% /I"%RL%" /I"%RL%\external\glfw\include" /I"%MINIZDIR%" /I"%ROOT%" /I"%SRCDIR%" /c "%ROOT%\src\main.c" /Fomain.obj || exit /b 1
          link /nologo /OUT:app.exe main.obj *.obj raylib.lib %LIBS% || exit /b 1
          echo BUILD OK

      - name: Upload (release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app.exe

  build-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev
      - name: Clone raylib
        run: git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git third_party/raylib
      - name: Build
        run: |
          cd third_party/raylib/src
          make PLATFORM=PLATFORM_DESKTOP RAYLIB_LIBTYPE=STATIC RAYLIB_RELEASE_PATH=../src
          cd "$GITHUB_WORKSPACE"
          mkdir -p build && cd build
          gcc -O2 -Wall -I../src -I../third_party/raylib/src -I../third_party/miniz -I../third_party/raylib/src/external/glfw/include -DPLATFORM_DESKTOP -D_CRT_SECURE_NO_WARNINGS -c $(find ../src -name "*.c" ! -name "main.c" ! -name "test_import.c") || true
          gcc -O2 -Wall -I../src -I../third_party/raylib/src -I../third_party/miniz -I../third_party/raylib/src/external/glfw/include -DPLATFORM_DESKTOP -c ../tests/test_import.c
          gcc -o test_import *.o ../third_party/raylib/src/libraylib.a -lm -lpthread -ldl -lrt
          cd "$GITHUB_WORKSPACE" && build/test_import

  build-macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Clone raylib
        run: git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git third_party/raylib
      - name: Build
        run: |
          cd third_party/raylib/src
          make PLATFORM=PLATFORM_DESKTOP RAYLIB_LIBTYPE=STATIC RAYLIB_RELEASE_PATH=../src
          cd "$GITHUB_WORKSPACE"
          mkdir -p build && cd build
          clang -O2 -Wall -I../src -I../third_party/raylib/src -I../third_party/miniz -I../third_party/raylib/src/external/glfw/include -DPLATFORM_DESKTOP -c $(find ../src -name "*.c" ! -name "main.c" ! -name "test_import.c") || true
          clang -O2 -Wall -I../src -I../third_party/raylib/src -I../third_party/miniz -I../third_party/raylib/src/external/glfw/include -DPLATFORM_DESKTOP -c ../tests/test_import.c
          clang -o test_import *.o ../third_party/raylib/src/libraylib.a -framework CoreVideo -framework IOKit -framework Cocoa -framework GLUT -framework OpenGL
