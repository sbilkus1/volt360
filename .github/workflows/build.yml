name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Clone raylib
        shell: cmd
        run: |
          mkdir third_party
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git third_party\raylib

      - name: Build, Test, App
        shell: cmd
        run: cmd /c build.bat

      - name: Upload (release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app.exe

  build-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev
      - name: Clone raylib
        run: git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git third_party/raylib
      - name: Build raylib
        run: cd third_party/raylib/src && make PLATFORM=PLATFORM_DESKTOP RAYLIB_LIBTYPE=STATIC
      - name: Compile test (best-effort)
        run: |
          mkdir -p build && cd build
          gcc -O2 -Wall -I../src -I../third_party/raylib/src -I../third_party/miniz -I../third_party/raylib/src/external/glfw/include -DPLATFORM_DESKTOP -o test_import ../tests/test_import.c ../third_party/raylib/src/libraylib.a -lm -lpthread -ldl -lrt || exit 0
          if [ -f test_import ]; then ./test_import || true; fi

  build-macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Clone raylib
        run: git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git third_party/raylib
      - name: Build raylib
        run: cd third_party/raylib/src && make PLATFORM=PLATFORM_DESKTOP RAYLIB_LIBTYPE=STATIC
      - name: Compile test (best-effort)
        run: |
          mkdir -p build && cd build
          clang -O2 -Wall -I../src -I../third_party/raylib/src -I../third_party/miniz -I../third_party/raylib/src/external/glfw/include -DPLATFORM_DESKTOP -o test_import ../tests/test_import.c ../third_party/raylib/src/libraylib.a -framework CoreVideo -framework IOKit -framework Cocoa -framework OpenGL || exit 0
          if [ -f test_import ]; then ./test_import || true; fi
