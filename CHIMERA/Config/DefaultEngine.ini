// GDD 1 (world) + 2 (raytracing). DefaultEngine.ini.
[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/CHIMERA.ChimeraGameModeBase
GameDefaultMap=/Engine/Maps/Templates/OpenWorld
EditorStartupMap=/Engine/Maps/Templates/OpenWorld
TransitionMap=/Engine/Maps/Templates/OpenWorld

[/Script/Engine.Engine]
GameInstanceClass=/Script/Engine.GameInstance

# GDD 2 - Full path-traced pipeline. The world is procedurally built at runtime
# by AChimeraWorld, so the map asset is just an empty OpenWorld template.
[SystemSettings]
r.PathTracing.Enable=1
r.PathTracing.MaxBounces=16
r.PathTracing.MaxSamplesPerPixel=64
r.RayTracing.Enable=1
r.Nanite=1
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
